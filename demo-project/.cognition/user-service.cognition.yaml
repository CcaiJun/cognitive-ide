  - id: "RISK-USER-002"
    level: "medium"
    title: "暴力破解风险"
    description: "登录接口可能遭受暴力破解攻击"
    mitigation: "实现速率限制(5次/分钟/IP)和账户锁定机制"
    status: "mitigated"

