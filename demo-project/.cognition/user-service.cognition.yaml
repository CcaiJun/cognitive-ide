decisions:
  - id: "DEC-USER-001"
    title: "JWT短期令牌+Refresh Token方案"
    context: "需要在安全性和用户体验之间平衡"
    decision: "Access Token有效期15分钟，Refresh Token有效期7天"
    consequences: "用户需要偶尔刷新令牌，但安全性显著提升"
    linked_issue: null

