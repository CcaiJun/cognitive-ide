responsibility:
  summary: "库存领域服务——管理商品库存查询、锁定、释放与补货"
  detail: |
    InventoryService 负责商品库存的全生命周期管理：
    1. 查询商品库存数量
    2. 锁定库存（下单时预留）
    3. 释放库存（取消订单时归还）
    4. 确认库存扣减（支付成功后）
    5. 低库存预警与自动补货触发

interfaces:
  - name: "checkStock"
    signature: "async checkStock(productId: string, quantity: number): Promise<StockResult>"
    access: "public"
    side_effects: []
    callers:
      - node_id: "order-service"
        file: "src/order/order.service.ts"
    preconditions: ["商品ID有效"]
    complexity: "low"

  - name: "lockStock"
    signature: "async lockStock(productId: string, quantity: string, orderId: string): Promise<LockResult>"
    access: "public"
    side_effects: ["锁定库存记录", "写入锁定日志"]
    callers:
      - node_id: "order-service"
        file: "src/order/order.service.ts"
    preconditions: ["库存充足", "订单ID有效"]
    complexity: "medium"

  - name: "releaseStock"
    signature: "async releaseStock(orderId: string): Promise<void>"
    access: "public"
    side_effects: ["释放锁定库存"]
    callers:
      - node_id: "order-service"
        file: "src/order/order.service.ts"
    preconditions: ["锁定记录存在"]
    complexity: "medium"

  - name: "confirmDeduction"
    signature: "async confirmDeduction(orderId: string): Promise<void>"
    access: "public"
    side_effects: ["扣减实际库存", "更新库存快照"]
    callers:
      - node_id: "payment-service"
        file: "src/payment/payment.service.ts"
    preconditions: ["支付已完成"]
    complexity: "low"

