data_flow:
  description: "库存锁定主流程"
  steps:
    - action: "接收锁定请求"
      input: "productId + quantity + orderId"
      calls: "lockStock"
    - action: "检查库存"
      calls: "checkStock"
      output: "库存确认结果"
    - action: "创建锁定记录"
      writes_to: "inventory_locks数据库表"
    - action: "扣减可用库存"
      writes_to: "inventory数据库表"

decisions:
  - id: "DEC-INV-001"
    title: "使用Redis分布式锁防止库存超卖"
    context: "高并发场景下多个用户同时锁定同一商品库存"
    decision: "通过Redis分布式锁+数据库乐观锁双重保护"
    consequences: "性能略有下降但数据一致性有保障"
    linked_issue: null

