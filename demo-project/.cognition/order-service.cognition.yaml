responsibility:
  summary: "订单核心领域服务——处理订单创建、状态流转、支付对接、库存联动与通知分发"
  detail: |
    OrderService 是整个电商系统的核心领域服务，负责：
    1. 创建订单并验证商品可用性
    2. 管理订单状态机：pending → confirmed → paid → shipped → completed / cancelled
    3. 与 PaymentService 对接完成支付流程
    4. 与 InventoryService 联动锁定/释放库存
    5. 通过 NotificationService 发送订单状态变更通知

