data_flow:
  description: "订单创建主流程"
  steps:
    - action: "接收创建订单请求"
      input: "userId + OrderItemDTO[]"
      calls: "createOrder"
    - action: "验证商品库存"
      calls: "inventory-service.checkStock"
      output: "库存确认结果"
    - action: "创建订单记录"
      writes_to: "orders数据库表"
      output: "Order实体"
    - action: "锁定库存"
      calls: "inventory-service.lockStock"
    - action: "发送订单创建通知"
      calls: "notification-service.sendOrderCreated"
      publishes: "order.created"

decisions:
  - id: "DEC-001"
    title: "使用领域事件代替直接调用通知服务"
    context: "订单状态变更需要触发多种通知（邮件、短信、推送）"
    decision: "通过领域事件机制异步发送通知，降低订单服务与通知服务的耦合"
    consequences: "通知发送失败不会阻塞订单流程，但需要处理最终一致性"
    linked_issue: null

risks:
  - id: "RISK-001"
    level: "high"
    title: "分布式事务一致性"
    description: "订单创建涉及库存锁定和支付，跨服务事务可能出现不一致"
    mitigation: "使用 Saga 模式 + 补偿事务"
    status: "open"
  - id: "RISK-002"
    level: "medium"
    title: "高并发下单库存超卖"
    description: "高峰期多个用户同时下单可能导致库存超卖"
    mitigation: "Redis 分布式锁 + 数据库乐观锁双重保护"
    status: "open"

